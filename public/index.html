<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบจัดตารางสอนอัตโนมัติ วิทยาลัยการอาชีพปัตตานี</title>
    <meta name="description" content="ระบบจัดตารางสอนและบริหารจัดการเวลาเรียนอัตโนมัติ วิทยาลัยการอาชีพปัตตานี">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            color: #ffffff;
        }

        .login-brand h1 {
            font-size: 20px;
            color: #0f172a;
            font-weight: 700;
            line-height: 1.3;
        }

        .login-brand p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .quick-accounts {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed #e2e8f0;
        }

        .quick-accounts p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .quick-btn-group {
            display: flex;
            gap: 8px;
        }

        .quick-btn-group button {
            flex: 1;
            padding: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            font-size: 12px;
            color: #334155;
            cursor: pointer;
            transition: var(--transition);
        }

        .quick-btn-group button:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-logo">🎓</div>
                <h1>วิทยาลัยการอาชีพปัตตานี</h1>
                <p>ระบบจัดตารางสอนอัตโนมัติ (Smart Timetable)</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="username" class="form-control" placeholder="เช่น admin, academic, somchai" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div id="loginAlert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px;"></div>

                <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
                    เข้าสู่ระบบ ➜
                </button>
            </form>

            <div class="quick-accounts">
                <p>⚡ เลือกบัญชีทดสอบด่วน:</p>
                <div class="quick-btn-group">
                    <button type="button" onclick="fillAccount('admin', 'admin1234')">👨‍💼 ผู้ดูแลระบบ</button>
                    <button type="button" onclick="fillAccount('academic', 'academic1234')">📑 ฝ่ายวิชาการ</button>
                    <button type="button" onclick="fillAccount('narathorn', 'teacher1234')">👨‍🏫 ครูนราธร (ช่างยนต์)</button>
                    <button type="button" onclick="fillAccount('theera', 'teacher1234')">👨‍🏫 ครูธีระ (IT)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function fillAccount(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            document.getElementById('loginAlert').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const alertBox = document.getElementById('loginAlert');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'กำลังตรวจสอบ...';
            alertBox.style.display = 'none';

            try {
                const res = await apiCall('/auth/login', {
                    method: 'POST',
                    body: { username, password }
                });

                if (res.success) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#dcfce7';
                    alertBox.style.color = '#15803d';
                    alertBox.innerHTML = '✅ เข้าสู่ระบบสำเร็จ กำลังนำท่านเข้าสู่ระบบ...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = '#fee2e2';
                alertBox.style.color = '#b91c1c';
                alertBox.innerHTML = `❌ ${err.message}`;
                btn.disabled = false;
                btn.textContent = 'เข้าสู่ระบบ ➜';
            }
        });
    </script>
</body>
</html>
